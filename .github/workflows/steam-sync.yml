name: Sync Steam Playtime

# Corre todos los días a las 09:00 UTC (≈ 05:00 o 06:00 hora Chile según horario de verano)
# y también se puede lanzar manualmente desde la pestaña "Actions" del repo.
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync-steam:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Steam playtime
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
        run: node scripts/fetch-steam.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/backlog-steam.json
          git diff --staged --quiet || git commit -m "chore: actualizar horas de Steam [automated]"
          git push
